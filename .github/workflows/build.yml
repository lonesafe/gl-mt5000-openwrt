name: Build GL-MT5000 OpenWrt (DSA)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (留空则用 SNAPSHOT-日期)"
        required: false
        default: ""
      make_release:
        description: "编译成功后发布到 Release"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

env:
  # Use GLiNet's mt5000 branch directly — it is based on openwrt main
  # (kernel 6.18) and already contains the MT5000 device support + DSA
  # switch driver. This avoids the 6.18 -> 6.12 patch conflicts.
  REPO_URL: https://github.com/GLiNet-Tech/openwrt.git
  REPO_BRANCH: mt5000
  OP_PACKAGES_FEED: https://github.com/lonesafe/op-packages.git
  OPENWRT_PATH: /mnt/openwrt
  TZ: Europe/Lisbon

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev ccache qemu-utils

      - name: Clone GLiNet mt5000 branch (openwrt main, kernel 6.18)
        run: |
          sudo mkdir -p "$OPENWRT_PATH"
          sudo chown "$USER:$USER" "$OPENWRT_PATH"
          git clone --depth 1 -b "$REPO_BRANCH" "$REPO_URL" "$OPENWRT_PATH"
          cd "$OPENWRT_PATH"
          echo "HEAD: $(git rev-parse --short HEAD) on $REPO_BRANCH"

      - name: Cache downloads & ccache
        uses: actions/cache@v4
        with:
          path: |
            /mnt/openwrt/dl
            /mnt/openwrt/.ccache
          key: mt5000-${{ hashFiles('config/mt5000.config', 'scripts/diy.sh') }}
          restore-keys: mt5000-

      - name: Apply DSA network config & defaults
        run: |
          cd "$OPENWRT_PATH"
          bash "$GITHUB_WORKSPACE/scripts/diy.sh"

      - name: Add, update & install feeds
        run: |
          cd "$OPENWRT_PATH"
          printf '\nsrc-git op_packages %s\n' "$OP_PACKAGES_FEED" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd "$OPENWRT_PATH"
          cp "$GITHUB_WORKSPACE/config/mt5000.config" .config
          make defconfig

      - name: Verify native switch driver is selected
        run: |
          cd "$OPENWRT_PATH"
          grep -q '^CONFIG_NET_DSA_REALTEK_RTL8366UB=y' \
            target/linux/mediatek/filogic/config-6.18 \
            || { echo "ERROR: native RTL8366UB DSA driver is missing"; exit 1; }
          echo "native RTL8366UB DSA driver: selected"

      - name: Download sources
        run: |
          cd "$OPENWRT_PATH"
          make -j$(nproc) download || make -j1 download

      - name: Compile firmware (multi-thread)
        run: |
          cd "$OPENWRT_PATH"
          # 多线程编译，失败后自动重试，最后单线程排错
          make -j$(nproc) IGNORE_ERRORS=n \
            || make -j$(nproc) IGNORE_ERRORS=n \
            || make -j1 V=s

      - name: Collect firmware
        if: always()
        run: |
          cd "$OPENWRT_PATH"
          mkdir -p "$GITHUB_WORKSPACE/artifact"
          find bin/targets -type f \( -name '*sysupgrade.bin' -o -name '*initramfs*.bin' \
            -o -name '*.manifest' -o -name 'config.buildinfo' \
            -o -name '*.img' \) \
            -exec cp {} "$GITHUB_WORKSPACE/artifact/" \; || true
          cp .config "$GITHUB_WORKSPACE/artifact/resolved.config" || true
          ls -la "$GITHUB_WORKSPACE/artifact/" || true

      - name: Upload firmware artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gl-mt5000-firmware
          path: artifact/
          if-no-files-found: warn
          retention-days: 14

      - name: Determine release tag
        if: inputs.make_release == true
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=SNAPSHOT-$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Release
        if: inputs.make_release == true
        run: |
          cd "$GITHUB_WORKSPACE/artifact"
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Publishing release: $TAG"
          # 删除已存在的同名 release（用于覆盖 SNAPSHOT）
          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          # 创建 release 并上传所有固件
          gh release create "$TAG" \
            --title "GL-MT5000 OpenWrt $TAG" \
            --notes "Auto-built firmware for GL.iNet GL-MT5000 (DSA switch).
          - sysupgrade.bin: flash image
          - initramfs-kernel.bin: RAM-boot kernel for serial testing
          - resolved.config: actual build config" \
            * 2>&1 || { echo "Release failed"; exit 1; }
          echo "Release $TAG published successfully"
