name: Build GL-MT5000 OpenWrt (DSA)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (留空则用 SNAPSHOT-日期)"
        required: false
        default: ""
      make_release:
        description: "编译成功后发布到 Release"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: main
  OP_PACKAGES_FEED: https://github.com/lonesafe/op-packages.git
  OPENWRT_PATH: /mnt/openwrt
  TZ: Europe/Lisbon

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev ccache qemu-utils zip jq

      - name: Clone official OpenWrt main (kernel 6.18)
        run: |
          sudo mkdir -p "$OPENWRT_PATH"
          sudo chown "$USER:$USER" "$OPENWRT_PATH"
          git clone --depth 1 -b "$REPO_BRANCH" "$REPO_URL" "$OPENWRT_PATH"
          cd "$OPENWRT_PATH"
          echo "HEAD: $(git rev-parse --short HEAD) on $REPO_BRANCH"

      - name: Cache downloads & ccache
        uses: actions/cache@v4
        with:
          path: |
            /mnt/openwrt/dl
            /mnt/openwrt/.ccache
          key: mt5000-${{ hashFiles('config/mt5000.config', 'scripts/diy.sh', 'patches/gl-mt5000-support.patch') }}
          restore-keys: mt5000-

      - name: Apply GL-MT5000 device support patch & defaults
        run: |
          cd "$OPENWRT_PATH"
          bash "$GITHUB_WORKSPACE/scripts/diy.sh"

      - name: Add, update & install feeds
        run: |
          cd "$OPENWRT_PATH"
          printf '%s\n' \
            'src-git op_packages $OP_PACKAGES_FEED' \
            'src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main' \
            'src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages.git;main' \
            'src-git diskman https://github.com/lisaac/luci-app-diskman.git;master' \
            'src-git dockerman https://github.com/lisaac/luci-app-dockerman.git;master' \
            'src-git kms https://github.com/gaoderby/luci-app-kms.git;main' \
            >> feeds.conf.default
          ./scripts/feeds update -a || echo "warn: some feeds failed to update"
          ./scripts/feeds install -a || echo "warn: some feeds failed to install"
          for p in luci-app-ddns luci-app-diskman luci-app-dockerman luci-app-passwall \
                   luci-app-upnp luci-app-vlmcsd vlmcsd xl2tpd; do
            ./scripts/feeds install "$p" 2>/dev/null \
              || echo "warn: $p could not be installed"
          done

      - name: Configure
        run: |
          cd "$OPENWRT_PATH"
          cp "$GITHUB_WORKSPACE/config/mt5000.config" .config

          # --- Critical disables BEFORE defconfig ---
          # ttyd CMake requires libwebsockets built with -DLWS_WITH_LIBUV=ON.
          # OpenWrt feed libwebsockets does NOT have that flag -> cmake error.
          # Remote tried enabling libwebsockets-full (the "full" variant has libuv)
          # but libwebsockets-full REQUIRES libuv.so.1 + libcap.so.2 runtime libs
          # absent from the sysupgrade rootfs -> package build fails ->
          # "make world" aborts -> NO firmware image is generated.
          # Fix: disable both ttyd and libwebsockets-full entirely.
          echo 'CONFIG_PACKAGE_ttyd=n'               >> .config
          echo 'CONFIG_PACKAGE_luci-app-ttyd=n'      >> .config
          echo 'CONFIG_PACKAGE_luci-app-tcpdump=n'    >> .config
          echo 'CONFIG_PACKAGE_libwebsockets-full=n'  >> .config

          echo 'CONFIG_ALL_KMODS=y' >> .config
          echo 'CONFIG_AUTOREMOVE=y' >> .config
          make defconfig

          # Turn every available luci package into a module.
          perl -0pi -e 's/^# (CONFIG_PACKAGE_luci-[^\s=]+) is not set$/$1=m/mg' .config

          # Explicitly select requested apps.
          for p in luci-app-ddns luci-app-diskman luci-app-dockerman luci-app-passwall \
                   luci-app-upnp luci-app-vlmcsd xl2tpd; do
            sed -i "s/^# CONFIG_PACKAGE_$p is not set$/CONFIG_PACKAGE_$p=m/" .config
          done

          # Verify disables
          grep -q '^CONFIG_PACKAGE_ttyd=n'                .config && echo "ttyd: DISABLED (libwebsockets libuv mismatch)"
          grep -q '^CONFIG_PACKAGE_luci-app-ttyd=n'       .config && echo "luci-app-ttyd: DISABLED"
          grep -q '^CONFIG_PACKAGE_libwebsockets-full=n' .config && echo "libwebsockets-full: DISABLED"

          echo "luci/plugin modules: $(grep -c '^CONFIG_PACKAGE_luci-.*=m' .config)"
          echo "kmod modules:       $(grep -c '^CONFIG_PACKAGE_kmod-.*=m' .config)"

      - name: Verify native switch driver is selected
        run: |
          cd "$OPENWRT_PATH"
          grep -q '^CONFIG_NET_DSA_REALTEK_RTL8366UB=y' \
            target/linux/mediatek/filogic/config-6.18 \
            || { echo "ERROR: native RTL8366UB DSA driver is missing"; exit 1; }
          echo "native RTL8366UB DSA driver: selected"

      - name: Download sources
        run: |
          cd "$OPENWRT_PATH"
          make -j$(nproc) download V=s || make -j1 download V=s

      - name: Compile firmware + full plugin library (multi-thread)
        run: |
          cd "$OPENWRT_PATH"
          # Best-effort full build: ignore single-package failures so the
          # firmware image + the bulk of the plugin library still get produced
          # and published. IGNORE_ERRORS=y keeps kmod/package build going past
          # incompatible packages; the final Release notes list what was omitted.
          make -j$(nproc) V=sc IGNORE_ERRORS=y \
            || make -j1 V=s IGNORE_ERRORS=y \
            || echo "warn: compile finished with errors; publishing partial library"

      - name: Collect firmware
        if: always()
        run: |
          cd "$OPENWRT_PATH"
          mkdir -p "$GITHUB_WORKSPACE/artifact"
          find bin/targets -type f \( -name '*sysupgrade.bin' -o -name '*initramfs*.bin' \
            -o -name '*.manifest' -o -name 'config.buildinfo' \
            -o -name '*.img.gz' -o -name '*.img' \) \
            -exec cp {} "$GITHUB_WORKSPACE/artifact/" \; || true
          cp .config "$GITHUB_WORKSPACE/artifact/resolved.config" || true
          echo "=== firmware artifact contents ==="
          ls -lh "$GITHUB_WORKSPACE/artifact/" || true

      - name: Build opkg index & package repository zip
        if: always()
        run: |
          cd "$OPENWRT_PATH"
          make package/index 2>/dev/null \
            || echo "warn: index regen skipped, using build-time indices"
          cd "$GITHUB_WORKSPACE"
          mkdir -p repo
          ( cd "$OPENWRT_PATH" && \
            zip -r "$GITHUB_WORKSPACE/repo/package.zip" \
              bin/packages \
              $(ls -d bin/targets/*/*/packages 2>/dev/null) )
          echo "=== package.zip size ==="
          ls -lh "$GITHUB_WORKSPACE/repo/package.zip"
          echo "packages: $(find "$OPENWRT_PATH/bin/packages" -name '*.ipk' | wc -l)"
          echo "kmods:    $(find "$OPENWRT_PATH/bin/targets" -path '*/packages/*.ipk' | wc -l)"

      - name: Upload firmware artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gl-mt5000-firmware
          path: artifact/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload package repository artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gl-mt5000-packages
          path: repo/
          if-no-files-found: warn
          retention-days: 14

      - name: Determine release tag
        if: always()
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=SNAPSHOT-$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Publishing release: $TAG"
          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          NOTES=$'Auto-built firmware for GL.iNet GL-MT5000 (DSA switch) + full plugin library.\n\nFirmware:\n- sysupgrade.bin: flash image\n- initramfs-kernel.bin: RAM-boot kernel for serial testing\n- resolved.config: actual build config\n\nPlugin library (package.zip):\n- bin/packages/<arch>/*: all built .ipk (luci-apps, utils)\n- bin/targets/mediatek/filogic/packages: all kmod .ipk\n\nUnzip and point opkg at the bin/ tree, or serve it over HTTP.'
          gh release create "$TAG" \
            --title "GL-MT5000 OpenWrt $TAG" \
            --notes "$NOTES" \
            artifact/* repo/package.zip 2>&1 || { echo "Release failed"; exit 1; }
          echo "Release $TAG published successfully"
